services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.2
    container_name: rekon-kafka
    command:
      - redpanda start
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda:29092,external://localhost:9092
      - --smp 1
      - --memory 512M
      - --mode dev-container
      - --reserve-memory 0M
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -i 'healthy:.*true'"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  receiver:
    build:
      context: .
      dockerfile: receiver/Dockerfile
    container_name: rekon-receiver
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
    ports:
      - "8000:8000"
    depends_on:
      redpanda:
        condition: service_healthy

volumes:
  redpanda_data:
